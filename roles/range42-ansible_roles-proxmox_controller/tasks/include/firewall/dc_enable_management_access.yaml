---
##
## ANTI-LOCKOUT AT THE DATACENTER : GUARANTEE MANAGEMENT ACCESS BEFORE ANY FIREWALL GOES ON.
##
## POST /cluster/firewall/rules, twice.
##
## >>> WHY THIS LEVEL AND NOT THE NODE <<<
## Proxmox applies the datacenter rules to every node's host chain. A guard placed here
## therefore covers a node that does not exist yet - a node added next month arrives
## protected, without anyone remembering to run anything on it. A per-node guard has to be
## replayed on every new node, and the one that is forgotten is the one that locks out.
## The node-level action is kept and stays usable for an explicit per-node guard on top.
##
##     8006/tcp   the Proxmox web interface and its API, which is also how this role talks
##                to the cluster : losing it means losing the tool that would fix it
##     22/tcp     ssh
##
## >>> POSITIONS ARE PASSED EXPLICITLY, AND THAT IS THE WHOLE POINT <<<
## The Proxmox firewall evaluates rules in order. An accept sitting below a deny accepts
## nothing. The barrier is the FIRST inbound DROP or REJECT - both block, they only differ
## in what they answer back. Presence is therefore not protection : the position is part of
## the question, and the test below asks it.
##
## >>> AND ENABLE IS PASSED EXPLICITLY TOO <<<
## A rule posted without `enable` is stored DISABLED by Proxmox : prefixed with a pipe in
## the file, absent from the compiled chain, granting nothing. The node-level guard shipped
## that way and its own test could not tell, because the test did not look at `enable`
## either - so it would have declared a node protected by two dead rules. Measured the
## 2026-08-27 on a live node. Both rules here carry `enable: 1` from the start, and the
## test below counts only rules that are actually active.
##
## Reading the chain first makes the action idempotent. Posting blindly appends another
## pair on every run.
##
## >>> THE PREDICATE BELOW EXISTS THREE TIMES <<<
## Here, in node_enable_management_access.yaml, and in node_enable.yaml. The role holds
## self-contained action files and uses no task includes at all, so sharing it would
## introduce a pattern the role does not have. The price is that the three copies MUST stay
## identical, and that is checked at delivery rather than left to discipline.
##

##
## >>> NO INTERFACE SCOPE AND NO SOURCE SCOPE : THAT IS DELIBERATE, NOT AN OVERSIGHT <<<
## Both accepts are posted with neither `iface` nor `source`, so they accept on EVERY
## interface from EVERY origin - including the guest networks, which means a guest can reach
## the api and ssh ports. That is broader than it should be and it is a known trade.
##
## The reason is an ordering of risks : a rule that is too broad can be narrowed later by
## anyone who can read the chain, while a lockout costs physical or console access to every
## node. Narrowing it here would mean guessing the name of the management interface and the
## addresses of the management plane, and a wrong guess is exactly the failure that cannot be
## undone remotely. The priority, while the range is being built, is keeping access.
##
## An administrator who knows their own topology narrows these rules by hand, naming the
## interface and the sources that fit their infrastructure - which this role cannot infer.
##
## Restricting them properly is separate work : it depends on where the deployer sits, on the
## gateways of the guest networks since the deployer reaches guests through them, and on a
## whitelist that belongs in the workspace vault. It gets its own issue rather than a guess
## made here.
##

- block:
    ####
    ####
    ## Read before write : what is already there decides what gets posted.
    ####

    - name: FIREWALL - DATACENTER - ENABLE MANAGEMENT ACCESS - READ THE CURRENT CHAIN
      uri:
        url: "https://{{ proxmox_api_host }}/api2/json/cluster/firewall/rules"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
      register: proxmox_call_rules

    ####
    ## The barrier is the FIRST inbound DROP or REJECT. 99999 is the sentinel for a chain
    ## with no deny at all : a fresh datacenter has none, both accepts then read as absent
    ## and both get posted, which is the wanted behaviour.
    ##
    ## Two ACCEPTs on DISJOINT ports commute : whichever comes first changes nothing. What
    ## is load bearing is that BOTH sit above the first deny, and that BOTH are active.
    ##
    ## NOT covered here, on purpose : `source` is not part of the test. A rule scoped to a
    ## source that does not include the caller reads as present and is skipped. Widening
    ## management access to its several legitimate origins is separate work.
    ####

    - name: FIREWALL - DATACENTER - ENABLE MANAGEMENT ACCESS - WHERE THE CHAIN STARTS DENYING
      set_fact:
        ####
        ## A DENY ONLY COUNTS IF IT CAN REACH THE PORT WE ARE PROTECTING.
        ## Measured : an active DROP on 8006 sitting above an ACCEPT on 22 leaves 22 OPEN.
        ## Taking the first active deny of ANY port therefore refuses on a chain that works,
        ## and denying a service while allowing management is an ordinary configuration.
        ## A deny covers a port unless it carries a destination that is purely numeric AND
        ## different. Everything else covers : absent, empty, non numeric, a range, a list.
        ## The predicate therefore fails CLOSED on every form it does not recognise.
        ####
        _dc_fw_deny_all_pos: >-
          {{ ((proxmox_call_rules.json.data | default([], true))
          | selectattr('type', 'defined') | selectattr('type', 'equalto', 'in')
          | selectattr('action', 'defined') | selectattr('action', 'in', ['DROP', 'REJECT'])
          | selectattr('enable', 'defined')
          | rejectattr('enable', 'equalto', 0) | rejectattr('enable', 'equalto', '0')
          | selectattr('pos', 'defined') | map(attribute='pos') | map('int') | list) }}
        _dc_fw_deny_other_api_pos: >-
          {{ ((proxmox_call_rules.json.data | default([], true))
          | selectattr('type', 'defined') | selectattr('type', 'equalto', 'in')
          | selectattr('action', 'defined') | selectattr('action', 'in', ['DROP', 'REJECT'])
          | selectattr('enable', 'defined')
          | rejectattr('enable', 'equalto', 0) | rejectattr('enable', 'equalto', '0')
          | selectattr('dport', 'defined') | rejectattr('dport', 'none')
          | selectattr('dport', 'match', '^[0-9]+$')
          | rejectattr('dport', 'equalto', dc_fw_api_port | default('8006') | string)
          | selectattr('pos', 'defined') | map(attribute='pos') | map('int') | list) }}
        _dc_fw_deny_other_ssh_pos: >-
          {{ ((proxmox_call_rules.json.data | default([], true))
          | selectattr('type', 'defined') | selectattr('type', 'equalto', 'in')
          | selectattr('action', 'defined') | selectattr('action', 'in', ['DROP', 'REJECT'])
          | selectattr('enable', 'defined')
          | rejectattr('enable', 'equalto', 0) | rejectattr('enable', 'equalto', '0')
          | selectattr('dport', 'defined') | rejectattr('dport', 'none')
          | selectattr('dport', 'match', '^[0-9]+$')
          | rejectattr('dport', 'equalto', dc_fw_ssh_port | default('22') | string)
          | selectattr('pos', 'defined') | map(attribute='pos') | map('int') | list) }}
        _dc_fw_api_first_pos: >-
          {{ (((proxmox_call_rules.json.data | default([], true))
          | selectattr('type', 'defined') | selectattr('type', 'equalto', 'in')
          | selectattr('action', 'defined') | selectattr('action', 'equalto', 'ACCEPT')
          | selectattr('dport', 'defined')
          | selectattr('dport', 'equalto', dc_fw_api_port | default('8006') | string)
          | selectattr('enable', 'defined')
          | rejectattr('enable', 'equalto', 0) | rejectattr('enable', 'equalto', '0')
          | selectattr('pos', 'defined') | map(attribute='pos') | map('int') | list)
          + [99999]) | sort | first }}
        _dc_fw_ssh_first_pos: >-
          {{ (((proxmox_call_rules.json.data | default([], true))
          | selectattr('type', 'defined') | selectattr('type', 'equalto', 'in')
          | selectattr('action', 'defined') | selectattr('action', 'equalto', 'ACCEPT')
          | selectattr('dport', 'defined')
          | selectattr('dport', 'equalto', dc_fw_ssh_port | default('22') | string)
          | selectattr('enable', 'defined')
          | rejectattr('enable', 'equalto', 0) | rejectattr('enable', 'equalto', '0')
          | selectattr('pos', 'defined') | map(attribute='pos') | map('int') | list)
          + [99999]) | sort | first }}
    ####
    ## Separate task : keys of one set_fact are all evaluated against the state BEFORE the
    ## task, so these two cannot read the three positions from the same one.
    ####

    - name: FIREWALL - DATACENTER - ENABLE MANAGEMENT ACCESS - WHICH DENIES ACTUALLY COVER THESE PORTS
      set_fact:
        _dc_fw_deny_cover_api: "{{ ((_dc_fw_deny_all_pos | difference(_dc_fw_deny_other_api_pos)) + [99999]) | sort | first }}"
        _dc_fw_deny_cover_ssh: "{{ ((_dc_fw_deny_all_pos | difference(_dc_fw_deny_other_ssh_pos)) + [99999]) | sort | first }}"

    - name: FIREWALL - DATACENTER - ENABLE MANAGEMENT ACCESS - WHAT IS ALREADY IN PLACE, AND WELL PLACED
      set_fact:
        _dc_fw_has_api: "{{ (_dc_fw_api_first_pos | int) < (_dc_fw_deny_cover_api | int) }}"
        _dc_fw_has_ssh: "{{ (_dc_fw_ssh_first_pos | int) < (_dc_fw_deny_cover_ssh | int) }}"

    - name: FIREWALL - DATACENTER - ENABLE MANAGEMENT ACCESS - THE CHAIN AS IT READS NOW
      debug:
        msg: >-
          first covering deny, api at {{ _dc_fw_deny_cover_api }} and ssh at {{ _dc_fw_deny_cover_ssh }} :
          api {{ dc_fw_api_port | default('8006') }} at {{ _dc_fw_api_first_pos }} ->
          {{ 'protected' if _dc_fw_has_api else 'NOT PROTECTED, will be posted' }} ;
          ssh {{ dc_fw_ssh_port | default('22') }} at {{ _dc_fw_ssh_first_pos }} ->
          {{ 'protected' if _dc_fw_has_ssh else 'NOT PROTECTED, will be posted' }}

    ####
    ####
    ## The API port first : it is the way back in if anything else goes wrong.
    ####

    - name: FIREWALL - DATACENTER - ENABLE MANAGEMENT ACCESS - ACCEPT THE API PORT
      uri:
        url: "https://{{ proxmox_api_host }}/api2/json/cluster/firewall/rules"
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        body_format: json
        body:
          type: "in"
          action: "ACCEPT"
          proto: "tcp"
          dport: "{{ dc_fw_api_port | default('8006') }}"
          enable: 1
          pos: "{{ dc_fw_api_pos | default(0) }}"
          source: "{{ dc_fw_mgmt_source | default(omit) }}"
          comment: "{{ dc_fw_api_comment | default('range42 anti-lockout, proxmox api') }}"
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
      register: proxmox_call
      when: not _dc_fw_has_api

    ####
    ####
    ## Then ssh, immediately below it.
    ####

    - name: FIREWALL - DATACENTER - ENABLE MANAGEMENT ACCESS - ACCEPT SSH
      uri:
        url: "https://{{ proxmox_api_host }}/api2/json/cluster/firewall/rules"
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        body_format: json
        body:
          type: "in"
          action: "ACCEPT"
          proto: "tcp"
          dport: "{{ dc_fw_ssh_port | default('22') }}"
          enable: 1
          pos: "{{ dc_fw_ssh_pos | default(1) }}"
          source: "{{ dc_fw_mgmt_source | default(omit) }}"
          comment: "{{ dc_fw_ssh_comment | default('range42 anti-lockout, ssh') }}"
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
      register: proxmox_call_ssh
      when: not _dc_fw_has_ssh

    ####
    ## THE API IGNORES THE POSITION ASKED FOR AND INSERTS AT THE TOP OF THE CHAIN.
    ##
    ## So posting is not knowing. This action used to report success without ever looking at
    ## what it had produced, while the guest level action was taught to read back. That
    ## asymmetry is what these four tasks close : read the chain again, say where the two
    ## accepts actually landed, and REFUSE to report success if they are not reachable.
    ####

    - name: FIREWALL - DATACENTER - ENABLE MANAGEMENT ACCESS - READ THE CHAIN BACK
      uri:
        url: "https://{{ proxmox_api_host }}/api2/json/cluster/firewall/rules"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
      register: proxmox_call_after

    - name: FIREWALL - DATACENTER - ENABLE MANAGEMENT ACCESS - WHERE THE RULES ACTUALLY LANDED
      set_fact:
        _dc_fw_api_pos_after: >-
          {{ (((proxmox_call_after.json.data | default([], true))
          | selectattr('type', 'defined') | selectattr('type', 'equalto', 'in')
          | selectattr('action', 'defined') | selectattr('action', 'equalto', 'ACCEPT')
          | selectattr('dport', 'defined')
          | selectattr('dport', 'equalto', dc_fw_api_port | default('8006') | string)
          | selectattr('enable', 'defined')
          | rejectattr('enable', 'equalto', 0) | rejectattr('enable', 'equalto', '0')
          | selectattr('pos', 'defined') | map(attribute='pos') | map('int') | list)
          + [99999]) | sort | first }}
        _dc_fw_ssh_pos_after: >-
          {{ (((proxmox_call_after.json.data | default([], true))
          | selectattr('type', 'defined') | selectattr('type', 'equalto', 'in')
          | selectattr('action', 'defined') | selectattr('action', 'equalto', 'ACCEPT')
          | selectattr('dport', 'defined')
          | selectattr('dport', 'equalto', dc_fw_ssh_port | default('22') | string)
          | selectattr('enable', 'defined')
          | rejectattr('enable', 'equalto', 0) | rejectattr('enable', 'equalto', '0')
          | selectattr('pos', 'defined') | map(attribute='pos') | map('int') | list)
          + [99999]) | sort | first }}
        _dc_fw_deny_all_after: >-
          {{ ((proxmox_call_after.json.data | default([], true))
          | selectattr('type', 'defined') | selectattr('type', 'equalto', 'in')
          | selectattr('action', 'defined') | selectattr('action', 'in', ['DROP', 'REJECT'])
          | selectattr('enable', 'defined')
          | rejectattr('enable', 'equalto', 0) | rejectattr('enable', 'equalto', '0')
          | selectattr('pos', 'defined') | map(attribute='pos') | map('int') | list) }}
        _dc_fw_deny_other_api_after: >-
          {{ ((proxmox_call_after.json.data | default([], true))
          | selectattr('type', 'defined') | selectattr('type', 'equalto', 'in')
          | selectattr('action', 'defined') | selectattr('action', 'in', ['DROP', 'REJECT'])
          | selectattr('enable', 'defined')
          | rejectattr('enable', 'equalto', 0) | rejectattr('enable', 'equalto', '0')
          | selectattr('dport', 'defined') | rejectattr('dport', 'none')
          | selectattr('dport', 'match', '^[0-9]+$')
          | rejectattr('dport', 'equalto', dc_fw_api_port | default('8006') | string)
          | selectattr('pos', 'defined') | map(attribute='pos') | map('int') | list) }}
        _dc_fw_deny_other_ssh_after: >-
          {{ ((proxmox_call_after.json.data | default([], true))
          | selectattr('type', 'defined') | selectattr('type', 'equalto', 'in')
          | selectattr('action', 'defined') | selectattr('action', 'in', ['DROP', 'REJECT'])
          | selectattr('enable', 'defined')
          | rejectattr('enable', 'equalto', 0) | rejectattr('enable', 'equalto', '0')
          | selectattr('dport', 'defined') | rejectattr('dport', 'none')
          | selectattr('dport', 'match', '^[0-9]+$')
          | rejectattr('dport', 'equalto', dc_fw_ssh_port | default('22') | string)
          | selectattr('pos', 'defined') | map(attribute='pos') | map('int') | list) }}

    - name: FIREWALL - DATACENTER - ENABLE MANAGEMENT ACCESS - WHICH DENIES COVER THEM NOW
      set_fact:
        _dc_fw_deny_cover_api_after: "{{ ((_dc_fw_deny_all_after | difference(_dc_fw_deny_other_api_after)) + [99999]) | sort | first }}"
        _dc_fw_deny_cover_ssh_after: "{{ ((_dc_fw_deny_all_after | difference(_dc_fw_deny_other_ssh_after)) + [99999]) | sort | first }}"

    - name: FIREWALL - DATACENTER - ENABLE MANAGEMENT ACCESS - REFUSE TO REPORT A CHAIN THAT GRANTS NOTHING
      ansible.builtin.assert:
        that:
          - (_dc_fw_api_pos_after | int) < 99999
          - (_dc_fw_ssh_pos_after | int) < 99999
          - (_dc_fw_api_pos_after | int) < (_dc_fw_deny_cover_api_after | int)
          - (_dc_fw_ssh_pos_after | int) < (_dc_fw_deny_cover_ssh_after | int)
        fail_msg: >-
          The rules were written but the way back in is NOT in place, so this action will not
          report success. What the chain holds now : the web interface port
          {{ dc_fw_api_port | default('8006') }} {{ 'is not accepted by any active rule' if (_dc_fw_api_pos_after | int) >= 99999 else 'is accepted at position ' ~ _dc_fw_api_pos_after }} ;
          SSH {{ dc_fw_ssh_port | default('22') }} {{ 'is not accepted by any active rule' if (_dc_fw_ssh_pos_after | int) >= 99999 else 'is accepted at position ' ~ _dc_fw_ssh_pos_after }}.
          A rule that exists but is disabled does not count as accepted, and an accept placed
          below a rule that blocks the same port never runs. Read the chain, remove what is in
          the way, and run this action again. Turning the firewall on as it stands would cut
          remote access, and the arming action will refuse it.
        success_msg: >-
          way back in confirmed : api accepted at position {{ _dc_fw_api_pos_after }},
          ssh at {{ _dc_fw_ssh_pos_after }}, first covering deny at
          {{ 'none' if (_dc_fw_deny_cover_api_after | int) >= 99999 else _dc_fw_deny_cover_api_after }} for the api and
          {{ 'none' if (_dc_fw_deny_cover_ssh_after | int) >= 99999 else _dc_fw_deny_cover_ssh_after }} for ssh

    ####

    ####
    ####

    ####
    ## ONE OBJECT PER RULE, NOT ONE OBJECT PER CALL.
    ##
    ## This action manages TWO rules and used to report them flattened into two field
    ## families inside a single object. That breaks the devkit contract, where every reading
    ## is one json object per line and callers compose on that. Flattened, asking "what did
    ## you actually post" meant knowing both prefixes by heart.
    ##
    ## Published as a LIST : the wrapper flattens it like every other list action.
    ####

    - name: FIREWALL - DATACENTER - ENABLE MANAGEMENT ACCESS - BUILD JSON
      set_fact:
        firewall_dc_enable_management_access: >-
          {{ [
            {
              'action': "firewall_dc_enable_management_access",
              'source': "proxmox",
              'proxmox_node': proxmox_node,
              'dc_fw_rule': "api",
              'dc_fw_dport': (dc_fw_api_port | default('8006')),
              'dc_fw_pos_requested': (dc_fw_api_pos | default(0)),
              'dc_fw_pos_before': _dc_fw_api_first_pos,
                'dc_fw_pos_after': _dc_fw_api_pos_after,
              'dc_fw_already_present': _dc_fw_has_api,
              'dc_fw_covering_deny_pos_before': _dc_fw_deny_cover_api,
              'dc_fw_mgmt_source': (dc_fw_mgmt_source | default(omit)),
            },
            {
              'action': "firewall_dc_enable_management_access",
              'source': "proxmox",
              'proxmox_node': proxmox_node,
              'dc_fw_rule': "ssh",
              'dc_fw_dport': (dc_fw_ssh_port | default('22')),
              'dc_fw_pos_requested': (dc_fw_ssh_pos | default(1)),
              'dc_fw_pos_before': _dc_fw_ssh_first_pos,
                'dc_fw_pos_after': _dc_fw_ssh_pos_after,
              'dc_fw_already_present': _dc_fw_has_ssh,
              'dc_fw_covering_deny_pos_before': _dc_fw_deny_cover_ssh,
              'dc_fw_mgmt_source': (dc_fw_mgmt_source | default(omit)),
            }
          ] }}


    - name: FIREWALL - DATACENTER - ENABLE MANAGEMENT ACCESS - PRINT JSON
      debug:
        var: firewall_dc_enable_management_access

  ####
  ####

  when: proxmox_vm_action == "firewall_dc_enable_management_access"
