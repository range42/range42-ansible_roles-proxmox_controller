---
##
## APPLY ONE FIREWALL RULE ON A NODE.
##
## POST /nodes/{node}/firewall/rules
##
## The node-level counterpart of vm_apply_iptables_rule, with the same parameter shape
## under a node_fw_ prefix. Until now the role could only turn the node firewall on and
## off ; it could not declare a single rule there, which also blocked the cluster-level
## firewall work.
##
## Despite the name this is NOT raw iptables : every firewall action of this role talks to
## the Proxmox firewall API, which generates the iptables rules itself. The only action
## that touches iptables directly is network_delete_extra_snat_rules, because the SDN SNAT rule
## is owned by ifupdown2 rather than by pve-firewall.
##
## THE POSITION IS NOT A PARAMETER, AND IT NEVER WAS.
## PVE inserts a created rule at the TOP of the chain and IGNORES any position asked for.
## Measured four times the 2026-08-28, in the datacenter chain, in a node chain, and twice
## through the resulting order of two rules posted back to back. This action therefore
## stops accepting a position : asking for one promised something the API does not honour.
## To know where a rule landed, read the chain back with the matching list action.
##
## The deletion actions are a different matter and keep their position : DELETE by position
## is the only call the API offers, and it works.

- block:
    ####
    ####

    - name: FIREWALL - NODE - APPLY FW RULE
      uri:
        url: "https://{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/firewall/rules"
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        body_format: json
        body:
          action: "{{ node_fw_action }}"                        # ACCEPT | DROP | REJECT
          type: "{{ node_fw_type }}"                            # in | out | forward | group

          iface: "{{ node_fw_iface | default(omit) }}"          # STR
          source: "{{ node_fw_source | default(omit) }}"        # STR
          dest: "{{ node_fw_dest | default(omit) }}"            # STR
          proto: "{{ node_fw_proto | default(omit) }}"          # STR
          dport: "{{ node_fw_dport | default(omit) }}"          # STR
          sport: "{{ node_fw_sport | default(omit) }}"          # STR
          enable: "{{ node_fw_enable | default(omit) }}"        # BOOL
          comment: "{{ node_fw_comment | default(omit) }}"      # STR
          log: "{{ node_fw_log | default(omit) }}"              # ALERT | CRIT | ERR | WARNING | NOTICE | INFO | DEBUG | NOLOG
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
      register: proxmox_call

    ####
    ####

    - name: FIREWALL - NODE - APPLY FW RULE - proxmox_call
      debug:
        var: proxmox_call

    ####
    ####

    - name: FIREWALL - NODE - APPLY FW RULE - BUILD JSON
      set_fact:
        firewall_node_apply_iptables_rule:
          action: "firewall_node_apply_iptables_rule"
          source: "proxmox"
          proxmox_node: "{{ proxmox_node }}"

          node_fw_action: "{{ node_fw_action }}"
          node_fw_type: "{{ node_fw_type }}"
          node_fw_iface: "{{ node_fw_iface | default(omit) }}"
          node_fw_source: "{{ node_fw_source | default(omit) }}"
          node_fw_dest: "{{ node_fw_dest | default(omit) }}"
          node_fw_proto: "{{ node_fw_proto | default(omit) }}"
          node_fw_dport: "{{ node_fw_dport | default(omit) }}"
          node_fw_sport: "{{ node_fw_sport | default(omit) }}"
          node_fw_enable: "{{ node_fw_enable | default(omit) }}"
          node_fw_comment: "{{ node_fw_comment | default(omit) }}"
          node_fw_log: "{{ node_fw_log | default(omit) }}"

    ####
    ####
    ## This debug task is NOT cosmetic : the devkit helper extracts its payload with
    ##   select(type=="object" and has($action)) | .[$action]
    ## so a JSON key named EXACTLY like the action must appear in the task results.
    ## Without it the devkit returns an empty stream and exits 0 (silent failure).
    ####

    - name: FIREWALL - NODE - APPLY FW RULE - PRINT JSON
      debug:
        var: firewall_node_apply_iptables_rule

  ####
  ####

  when: proxmox_vm_action == "firewall_node_apply_iptables_rule"
