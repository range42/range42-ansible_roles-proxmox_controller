---
# One API coordinator, complete explicit SSH coverage, and private per-node rules.
- block:
    - name: NETWORK - SNAT - CLEAR COMPLETION BEFORE A NEW SNAPSHOT
      ansible.builtin.set_fact:
        network_snat_apply_verified: false
      when: proxmox_vm_action == 'network_snapshot_snat_rules'

    - name: NETWORK - SNAT - REQUIRE ONE API COORDINATOR
      ansible.builtin.assert:
        that: ansible_play_hosts_all | length == 1
        fail_msg: Global SDN apply requires exactly one API coordinator in this play.

    - name: NETWORK - SNAT - VALIDATE COMPLETE CLUSTER COVERAGE
      ansible.builtin.include_tasks: plan_snat_coverage.yaml

    - name: NETWORK - SNAT - SNAPSHOT EVERY NODE BEFORE WRITES
      ansible.builtin.include_tasks: snapshot_snat_nodes.yaml
      when: proxmox_vm_action == 'network_snapshot_snat_rules'

    - name: NETWORK - SNAT - REQUIRE COMPLETE APPLY BEFORE CLEANUP
      ansible.builtin.assert:
        that: network_snat_apply_verified | default(false) == true
        fail_msg: Every covered node must finish its verified SDN reload before cleanup.
      when: proxmox_vm_action != 'network_snapshot_snat_rules'

    - name: NETWORK - SNAT - RECONCILE EACH NODE'S DECLARED SOURCES
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "{{ lookup('file', role_path ~ '/files/snat_rules.py') }}"
          - reconcile-node
        stdin: "{{ {'node': network_snat_snapshots[_sdn_snat_node.node].node, 'targets': _sdn_snat_node.targets} | to_json }}"
      environment:
        PATH: /usr/sbin:/sbin:/usr/bin:/bin
      delegate_to: "{{ _sdn_snat_node.host }}"
      loop: "{{ network_snat_plan.nodes }}"
      loop_control:
        loop_var: _sdn_snat_node
        label: "{{ _sdn_snat_node.node }}"
      register: _sdn_snat_reconciled
      changed_when: _sdn_snat_reconciled.rc == 0 and ((_sdn_snat_reconciled.stdout | from_json).results | selectattr('deleted', 'gt', 0) | list | length) > 0
      failed_when: false
      no_log: true
      when: proxmox_vm_action == 'network_reconcile_snat_sources'

    - name: NETWORK - SNAT - REQUIRE EVERY NODE'S TARGET READBACK
      ansible.builtin.assert:
        that: _sdn_snat_reconciled.results | selectattr('rc', 'ne', 0) | list | length == 0
        fail_msg: A node could not verify its declared NAT state. Changes may be partial; inspect all covered nodes before retrying.
      when: proxmox_vm_action == 'network_reconcile_snat_sources'

    - name: NETWORK - SNAT - RESTORE EACH NODE'S UNTOUCHED SOURCES
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "{{ lookup('file', role_path ~ '/files/snat_rules.py') }}"
          - restore
        stdin: "{{ _sdn_snat_node.policy | combine({'snapshot': network_snat_snapshots[_sdn_snat_node.node]}) | to_json }}"
      environment:
        PATH: /usr/sbin:/sbin:/usr/bin:/bin
      delegate_to: "{{ _sdn_snat_node.host }}"
      loop: "{{ network_snat_plan.nodes }}"
      loop_control:
        loop_var: _sdn_snat_node
        label: "{{ _sdn_snat_node.node }}"
      register: _sdn_snat_restored
      changed_when: _sdn_snat_restored.rc == 0 and (_sdn_snat_restored.stdout | from_json).deleted > 0
      failed_when: false
      no_log: true
      when: proxmox_vm_action == 'network_restore_snat_snapshot'

    - name: NETWORK - SNAT - REQUIRE EVERY NODE'S PRESERVATION READBACK
      ansible.builtin.assert:
        that: _sdn_snat_restored.results | selectattr('rc', 'ne', 0) | list | length == 0
        fail_msg: SNAT preservation did not finish on every node. Apply may already have completed; inspect all covered nodes before retrying. Raw rules remain private.
      when: proxmox_vm_action == 'network_restore_snat_snapshot'

    - name: NETWORK - SNAT - REPORT COVERED NODES WITHOUT RAW RULES
      ansible.builtin.set_fact:
        network_restore_snat_snapshot:
          action: network_restore_snat_snapshot
          proxmox_node: "{{ proxmox_node }}"
          nodes: "{{ network_snat_plan.nodes | map(attribute='node') | list }}"
          snat_rule_preservation: cluster_exact_sources_v1
          preserved: true
      when: proxmox_vm_action == 'network_restore_snat_snapshot'
  when: proxmox_vm_action in ['network_snapshot_snat_rules', 'network_restore_snat_snapshot', 'network_reconcile_snat_sources']
