---
##
## #PR-30
##

- block:
    ####
    ####

    - name: FIREWALL - VM - ENABLE
      uri:
        url: "https://{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ vm_id }}/firewall/options"
        method: PUT
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        body_format: json
        body:
          enable: 1
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
      register: proxmox_call
      when: proxmox_vm_action == "firewall_vm_enable"

    ####
    ####

    - name: FIREWALL - VM - ENABLE - PRINT proxmox_call
      debug:
        var: proxmox_call

    - name: FIREWALL - VM - ENABLE - BUILD JSON
      set_fact:
        firewall_vm_enable:
          action: "firewall_vm_enable"
          source: "proxmox"
          proxmox_node: "{{ proxmox_node }}"
          #
          vm_id: "{{ vm_id | int }}"
          vm_name: "{{ vm_name }}"
          vm_firewall: "enabled"

    - name: FIREWALL - VM - ENABLE - PRINT JSON
      debug:
        var: firewall_vm_enable

  when: proxmox_vm_action == "firewall_vm_enable"
