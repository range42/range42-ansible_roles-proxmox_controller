---

- block:
    ####
    ####

    - name: NETWORK - VM - LIST NETWORK INTERFACES
      uri:
        url: "https://{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ vm_id }}/config"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
      register: proxmox_call

    ####
    ####

    - name: NETWORK - VM - LIST NETWORK INTERFACES - proxmox_call
      debug:
        var: proxmox_call

    ####
    ## >>> OPTIONS READ BY KEY, NEVER BY POSITION - AND ALL TEN OF THEM <<<
    ##
    ## A net line holds key=value pairs and the api emits only those the card carries, so an
    ## index points at whatever comes next : `bridge=vmbr0,link_down=1` read at index 2 gives
    ## firewall=1 on a card that has NO flag, and the consumer then arms it. Measured, 4 of 7
    ## realistic cards disagreed with a read by key.
    ##
    ## A key stays ABSENT when the option is absent : consumers branch on `is defined` to
    ## decide whether to resend it, so a literal placeholder would break them.
    ##
    ## All ten are published because writing net<N> replaces the WHOLE line - a read-modify-write
    ## resends only what the read gave it, and vm.replace.sdn_vnet recreates a card from this
    ## output. add_network_vm already accepted all ten : vm_network_<x> maps to iface_<x>.
    ##
    ## model and mac stay positional : the api normalises that pair to <model>=<MAC>, first.
    ## The device name AND its numeric id are both emitted, since delete addresses "net<id>".
    ## The line is parsed once into `_net_opts`. These notes sit out here because the scalar
    ## below is one single {{ }}, where a ## would reach Jinja as code.
    ####

    - name: NETWORK - VM - LIST NETWORK INTERFACES - BUILD JSON
      set_fact:
        network_list_interfaces_vm: >-
          {{ (network_list_interfaces_vm | default([])) +
            [ {
                'action': "network_list_interfaces_vm",
                'source': "proxmox",
                'proxmox_node': proxmox_node,
                'vm_id': vm_id,
                'vm_network_device'   : item.key,
                'vm_vmnet_id'         : item.key | regex_replace('^net', '') | int,
                'vm_network_type'     : item.value.split(',')[0].split('=',1)[0],
                'vm_network_mac'      : item.value.split(',')[0].split('=',1)[1],
                'vm_network_bridge'   : _net_opts.get('bridge',    omit),
                'vm_network_firewall' : _net_opts.get('firewall',  omit),
                'vm_network_tag'      : _net_opts.get('tag',       omit),
                'vm_network_mtu'      : _net_opts.get('mtu',       omit),
                'vm_network_queues'   : _net_opts.get('queues',    omit),
                'vm_network_rate'     : _net_opts.get('rate',      omit),
                'vm_network_link_down': _net_opts.get('link_down', omit),
                'vm_network_trunks'   : _net_opts.get('trunks',    omit)
            } ]
          }}
      vars:
        _net_opts: "{{ dict(item.value.split(',') | select('search','=') | map('split','=',1) | list) }}"
      loop: "{{ proxmox_call.json.data | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.key is match('^net[0-9]+$')

    - name: NETWORK - VM - LIST NETWORK INTERFACES - PRINT JSON
      debug:
        var: network_list_interfaces_vm
      when:
        - network_list_interfaces_vm is defined
        - network_list_interfaces_vm | length > 0

  when: proxmox_vm_action == "network_list_interfaces_vm"

