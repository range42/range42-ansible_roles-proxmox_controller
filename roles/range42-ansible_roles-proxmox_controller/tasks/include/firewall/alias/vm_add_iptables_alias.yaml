---
##
## ADD A FIREWALL ALIAS ON A GUEST.
##
## The report named `vm_fw_comment` - the RULE family's key, never set on this path - so
## `default(omit)` fired and the comment vanished from the report while the alias was created
## with it. Same defect as the guest reader carried until 2026-09-03. The dc sibling was right
## all along : keep the two identical, the asymmetry is what hid it.
##

- block:
    ####
    ####

    - name: FIREWALL - VM - ADD FW ALIAS
      uri:
        url: "https://{{ proxmox_api_host}}/api2/json/nodes/{{ proxmox_node}}/qemu/{{ vm_id }}/firewall/aliases"
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user}}!{{ proxmox_api_token_id}}={{ proxmox_api_token_secret}}"
        body_format: json
        body:
          name: "{{ vm_fw_alias_name }}"
          cidr: "{{ vm_fw_alias_cidr }}"
          comment: "{{ vm_fw_alias_comment | default(omit) }}" # STR
          #
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
      register: proxmox_call

    - name: FIREWALL - VM - ADD FW ALIAS - proxmox_call
      debug:
        var: proxmox_call

    ####
    ####

    - name: FIREWALL - VM - ADD FW ALIAS - BUILD JSON
      set_fact:
        firewall_vm_add_iptables_alias:
          action: "firewall_vm_add_iptables_alias"
          source: "proxmox"
          proxmox_node: "{{ proxmox_node }}"
          vm_id: "{{ vm_id }}"

          vm_fw_alias_name: "{{ vm_fw_alias_name | default(omit) }}"
          vm_fw_alias_cidr: "{{ vm_fw_alias_cidr | default(omit) }}"
          vm_fw_alias_comment: "{{ vm_fw_alias_comment | default(omit) }}"

    - name: FIREWALL - VM - ADD FW ALIAS - PRINT JSON
      debug:
        var: firewall_vm_add_iptables_alias

  when: proxmox_vm_action == "firewall_vm_add_iptables_alias"
