---
##
## ISSUE - 82
##

# import-file bugged / not fully implemented ?
#
# https://forum.proxmox.com/threads/workaround-how-to-refer-via-api-to-a-downloaded-image-file-stored-in-the-images-folder.161477/
# https://forum.proxmox.com/threads/new-vm-from-cloud-init-image-via-api.111091/#post-482517
# https://lore.proxmox.com/all/20250408121312.312526-1-d.csapak@proxmox.com/
# https://bugzilla.proxmox.com/show_bug.cgi?id=2424

- block:
    # Read the VM first and send only the values that differ: a stop power-cuts a running guest.
    - name: CLOUD INIT - CHECK IF VM IS RUNNING
      uri:
        url: "https://{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ vm_id }}/status/current"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
      register: _ci_vm_status
      failed_when: false
      check_mode: false  # read-only ; --check then lists the values that would change

    - name: CLOUD INIT - READ VM CONFIG
      uri:
        url: "https://{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ vm_id }}/config"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
      register: _ci_vm_config
      check_mode: false

    # Proxmox masks cipassword on read (and stores a hash on Linux ostypes), so it cannot be compared:
    # it is sent only when the VM has none yet or when ciuser or sshkeys change.
    # net0 is compared on its model and bridge only: Proxmox adds the MAC address on write.
    - name: CLOUD INIT - LIST THE VALUES THAT DIFFER FROM THE VM CONFIG
      vars:
        _cfg: "{{ _ci_vm_config.json.data }}"
        _plain: "{{ _ci_want | dict2items | rejectattr('key', 'in', ['cipassword', 'net0']) }}"
        _plain_diff: >-
          {{ _plain | difference(_cfg | dict2items | selectattr('key', 'in', _plain | map(attribute='key')))
             | map(attribute='key') }}
        _net0_diff: >-
          {{ vm_net_virtio_bridge is defined
             and (_cfg.net0 | default('') is not match('virtio=')
                  or (_cfg.net0 | default('') | regex_findall('bridge=([^,]+)') | first | default('')) != vm_net_virtio_bridge) }}
        _pw_diff: >-
          {{ vm_ci_password is defined
             and (_cfg.cipassword is not defined or 'ciuser' in _plain_diff or 'sshkeys' in _plain_diff) }}
      set_fact:
        _ci_diff: "{{ _plain_diff + (['net0'] if _net0_diff | bool else []) + (['cipassword'] if _pw_diff | bool else []) }}"

    # A net0 change cannot be hot-unplugged: shut the guest down (guest agent or ACPI), forced after 180 s.
    - name: CLOUD INIT - SHUT DOWN VM BEFORE A NET0 CHANGE (no hot-unplug, forced stop after 180 s)
      uri:
        url: "https://{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ vm_id }}/status/shutdown"
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
        body_format: form-urlencoded
        body:
          timeout: 180
          forceStop: 1
      changed_when: true
      when: _ci_restart | bool

    - name: CLOUD INIT - WAIT FOR VM TO STOP
      uri:
        url: "https://{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ vm_id }}/status/current"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
      register: _ci_vm_stop_check
      until: _ci_vm_stop_check.json.data.status == 'stopped'
      retries: 45
      delay: 5
      when: _ci_restart | bool

    # Cloud-init keys are accepted on a running VM ; the guest reads them at its next boot.
    - name: CLOUD INIT - INJECT VARIABLE
      uri:
        url: "https://{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ vm_id }}/config"
        method: PUT
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
        body_format: form-urlencoded
        body: "{{ _ci_want | dict2items | selectattr('key', 'in', _ci_diff) | items2dict }}"
      register: proxmox_call
      changed_when: true
      when: _ci_diff | length > 0

    - name: CLOUD INIT - INJECT VARIABLE
      debug:
        var: proxmox_call
      when: _ci_diff | length > 0

    ####
    ####
    ####

    - name: CLOUD INIT - REGEN TEMPLATE
      uri:
        url: "https://{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ vm_id }}/cloudinit"
        method: PUT
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
        body_format: raw
        body: ""
      register: proxmox_call
      changed_when: true
      when: _ci_diff | length > 0

    - name: TEMPLATE - CONVERT VM TO TEMPLATE PRINT JSON
      debug:
        var: proxmox_call
      when: _ci_diff | length > 0

    - name: CLOUD INIT - START VM AGAIN AFTER THE NET0 CHANGE (was running)
      uri:
        url: "https://{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ vm_id }}/status/start"
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
      changed_when: true
      when: _ci_restart | bool

    ####
    ####
    ####

    - name: CLOUD INIT - BUILD JSON
      set_fact:
        cloudinit_set_variables:
          action: "cloudinit_set_variables"
          source: "proxmox"
          proxmox_node: "{{ proxmox_node }}"
          vm_id: "{{ vm_id | int }}"
          template_status: "{{ 'unchanged' if _ci_diff | length == 0 else ('not written (check mode)' if ansible_check_mode else 'regenerated') }}"
          changed_keys: "{{ _ci_diff }}"

          ciuser: "{{ vm_ci_user | default(omit)  }}"
          cipassword: "{{ 'redacted' | default(omit)  }}"
          sshkeys: "{{ 'redacted' | default(omit)  }}"
          vm_ci_ip: "{{ vm_ci_ip | default(omit)  }}"
          vm_ci_ip_gw: "{{ vm_ci_ip_gw | default(omit)  }}"
          vm_ci_netmask: "{{ vm_ci_netmask | default(omit)  }}"
          vm_ci_dns_domain: "{{ vm_ci_dns_domain | default(omit)  }}"
          vm_ci_dns_ips: "{{ vm_ci_dns_ips | default(omit)  }}"

    - name: CLOUD INIT - PRINT JSON
      debug:
        var: cloudinit_set_variables

  vars:
    # Requested values, as the PUT sends them ; an undefined input is not sent.
    _ci_want: >-
      {{ {'sshkeys': vm_ci_ssh_key | trim | urlencode | replace('/', '%2F')}
         | combine({'ciuser': vm_ci_user | string} if vm_ci_user is defined else {})
         | combine({'cipassword': vm_ci_password | string} if vm_ci_password is defined else {})
         | combine({'searchdomain': vm_ci_dns_domain | string} if vm_ci_dns_domain is defined else {})
         | combine({'nameserver': vm_ci_dns_ips | string} if vm_ci_dns_ips is defined else {})
         | combine({'net0': 'virtio,bridge=' ~ vm_net_virtio_bridge} if vm_net_virtio_bridge is defined else {})
         | combine({'ipconfig0': 'ip=' ~ vm_ci_ip ~ '/' ~ vm_ci_netmask ~ ((',gw=' ~ vm_ci_ip_gw) if vm_ci_ip_gw is defined else '')}
                   if vm_ci_ip is defined else {}) }}
    _ci_restart: "{{ _ci_vm_status.json.data.status | default('stopped') == 'running' and 'net0' in _ci_diff }}"

  # when: proxmox_vm_action == "cloudinit_set_variables"
  when: proxmox_vm_action in ["cloudinit_set_variables", "template_create"]
  
