---
##
## DELETE THE SURPLUS LIVE SNAT RULES OF ONE SUBNET, down to sdn_snat_want.
## Deletes only, never creates : want=1 on a subnet at zero leaves zero, since creating
## the rule is the apply's job. want=0 cuts the subnet off from the outside.
##
## WHY : an apply is ifreload, which replays the vnet post-up hooks without playing the
## post-down ones, so each apply appends one more SNAT rule per subnet at snat=1.
## Setting snat=0 is worse, it drops the post-down hook before it ever ran and orphans
## the live rule. Matching on the source network rather than the target makes it work on
## SNAT and MASQUERADE alike, hence also on the rules left by the legacy hack.
##
## WHY NOT THE API : these rules are not API objects. They come from a post-up hook in
## /etc/network/interfaces.d, so the firewall endpoints, which only ever write the
## PVEFW-* chains, cannot see them.
##
## WHERE IT RUNS : the host carrying the API address is ansible_connection local, so a
## shell task there runs on the DEPLOYER. Only proxmox_cli reaches the node over SSH,
## hence the delegation on that one task. The assert and the output fact stay local.
##
## DO NOT CHANGE
##  1. the trailing SPACE in "-s ${S} " : without it 192.168.14 also matches
##     192.168.140.0/24 and deletes another subnet's rules.
##  2. the rule is read back and its -A turned into -D, so nothing is hardcoded.
##  3. the substitution feeding iptables is unquoted on purpose, the rule spec has to
##     split into separate arguments.
##  4. every iptables exit status is checked. Piping straight into "grep -c ... || true"
##     turned a missing binary into a count of zero, and the action reported a subnet
##     reconciled that it had never looked at.
##

- block:
    ####
    ####

    - name: NETWORK - DELETE SNAT RULES - CHECK THE SUBNET IS A WELL FORMED CIDR
      ansible.builtin.assert:
        that:
          - sdn_subnet_cidr is defined
          - sdn_subnet_cidr is string
          ## the match TEST, not the regex_search FILTER : a filter returns the matched
          ## text, and a conditional must resolve to a boolean.
          - sdn_subnet_cidr is match('^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$')
        fail_msg: >-
          sdn_subnet_cidr must be a CIDR with its mask, exactly as iptables renders it,
          for instance 192.168.199.0/24. Got: {{ sdn_subnet_cidr | default('<undefined>') }}
        success_msg: "sdn_subnet_cidr = {{ sdn_subnet_cidr | default('') }}"

    ####
    ####
    ## Without this the delegation below resolves to an empty host and the failure reads
    ## as a connection problem instead of an incomplete inventory.
    ####

    - name: NETWORK - DELETE SNAT RULES - CHECK THE NODE IS REACHABLE OVER SSH
      ansible.builtin.assert:
        that:
          - groups['proxmox_cli'] is defined
          - (groups['proxmox_cli'] | default([]) | length) > 0
        fail_msg: >-
          this action needs SSH access to the hypervisor, which the inventory declares in
          the proxmox_cli group. That group is missing or empty, so there is no host to run
          iptables on. The API host cannot be used, it is declared connection local.
        success_msg: "iptables will run on {{ groups['proxmox_cli'] | default([]) | first | default('') }}"

    ####
    ####
    ## The loop is bounded : looping until the count drops never ends if a deletion
    ## silently fails, and this runs on the hypervisor. The only tolerated failure below
    ## is grep's exit 1, which legitimately means zero matching rules.
    ####

    - name: NETWORK - DELETE SNAT RULES - NORMALISE THE LIVE RULE COUNT
      ## iptables lives in /usr/sbin, not always on a non interactive shell's PATH.
      environment:
        PATH: "/usr/sbin:/sbin:/usr/bin:/bin"
      ansible.builtin.shell: |
        set -u
        S='{{ sdn_subnet_cidr }}'
        want='{{ sdn_snat_want | default(1) }}'

        command -v iptables >/dev/null 2>&1 || {
          echo "delete_snat_rules: iptables not found on $(hostname), PATH=$PATH" >&2
          exit 1
        }

        ## counting on captured text, so a read failure cannot look like an empty chain
        table=$(iptables -t nat -S POSTROUTING) || {
          echo "delete_snat_rules: cannot read the nat table on $(hostname)" >&2
          exit 1
        }
        before=$(printf '%s\n' "$table" | grep -c -- "-s ${S} " || true)

        guard=0
        now="$before"
        while [ "$now" -gt "$want" ]; do
          guard=$((guard + 1))
          if [ "$guard" -gt 1000 ]; then
            echo "delete_snat_rules: gave up after 1000 deletions, the rule count is not decreasing" >&2
            exit 1
          fi

          rule=$(printf '%s\n' "$table" | grep -m1 -- "-s ${S} " | sed 's/^-A /-D /')
          if [ -z "$rule" ]; then
            echo "delete_snat_rules: counted ${now} rules but could not extract one to delete" >&2
            exit 1
          fi

          # shellcheck disable=SC2086
          iptables -t nat $rule || {
            echo "delete_snat_rules: deletion refused : ${rule}" >&2
            exit 1
          }

          table=$(iptables -t nat -S POSTROUTING) || {
            echo "delete_snat_rules: cannot re-read the nat table after a deletion" >&2
            exit 1
          }
          now=$(printf '%s\n' "$table" | grep -c -- "-s ${S} " || true)
        done
        after="$now"

        printf '{"before":%s,"after":%s,"want":%s,"deleted":%s}\n' \
          "$before" "$after" "$want" "$((before - after))"
      args:
        executable: /bin/bash
      ## by group, not by name, so the codename stays out of the role
      delegate_to: "{{ groups['proxmox_cli'] | first }}"
      register: proxmox_call
      changed_when: (proxmox_call.stdout | from_json).before != (proxmox_call.stdout | from_json).after

    ####
    ####

    - name: NETWORK - DELETE SNAT RULES - proxmox_call
      debug:
        var: proxmox_call

    ####
    ####

    - name: NETWORK - DELETE SNAT RULES - BUILD JSON
      set_fact:
        network_delete_snat_rules:
          action: "network_delete_snat_rules"
          source: "proxmox"
          proxmox_node: "{{ proxmox_node }}"

          subnet_cidr: "{{ sdn_subnet_cidr }}"

          ## which host was actually touched : this once ran on the deployer and still
          ## returned a clean zero
          snat_host: "{{ groups['proxmox_cli'] | first }}"

          snat_want: "{{ (proxmox_call.stdout | from_json).want }}"
          snat_before: "{{ (proxmox_call.stdout | from_json).before }}"
          snat_after: "{{ (proxmox_call.stdout | from_json).after }}"
          snat_deleted: "{{ (proxmox_call.stdout | from_json).deleted }}"

    ####
    ####
    ## This debug task is NOT cosmetic : the devkit helper extracts its payload with
    ##   select(type=="object" and has($action)) | .[$action]
    ## so a JSON key named EXACTLY like the action must appear in the task results.
    ## Without it the devkit returns an empty stream and exits 0 (silent failure).
    ####

    - name: NETWORK - DELETE SNAT RULES - PRINT JSON
      debug:
        var: network_delete_snat_rules

  ####
  ####

  when: proxmox_vm_action == "network_delete_snat_rules"
