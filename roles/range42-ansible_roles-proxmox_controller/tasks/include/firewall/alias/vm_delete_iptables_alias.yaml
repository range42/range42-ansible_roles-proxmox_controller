---
##
## DELETE ONE FIREWALL ALIAS ON A GUEST, BY NAME. Safe by construction : a name does not move
## when a neighbour disappears, unlike a rule's position.
##
## The report advertised a cidr and a comment a delete never receives - and the comment under
## `vm_fw_comment`, the RULE family's key. Both always vanished on omit, so dropping them
## changes nothing observable. It now reports the name, like the dc sibling.
##

- block:
    ####
    ####

    - name: FIREWALL - VM - DELETE FW ALIAS
      uri:
        url: "https://{{ proxmox_api_host}}/api2/json/nodes/{{ proxmox_node}}/qemu/{{ vm_id }}/firewall/aliases/{{ vm_fw_alias_name }}"
        method: DELETE
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user}}!{{ proxmox_api_token_id}}={{ proxmox_api_token_secret}}"
        # body_format: json
        # body:
          # name: "{{ vm_fw_alias_name }}"
          # cidr: "{{ vm_fw_alias_cidr }}"
          # comment: "{{ vm_fw_alias_comment | default(omit) }}" # STR
          #
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
      register: proxmox_call

    - name: FIREWALL - VM - DELETE FW ALIAS - proxmox_call
      debug:
        var: proxmox_call

    ####
    ####

    - name: FIREWALL - VM - DELETE FW ALIAS - BUILD JSON
      set_fact:
        firewall_vm_delete_iptables_alias:
          action: "firewall_vm_delete_iptables_alias"
          source: "proxmox"
          proxmox_node: "{{ proxmox_node }}"
          vm_id: "{{ vm_id }}"

          vm_fw_alias_name: "{{ vm_fw_alias_name | default(omit) }}"

    - name: FIREWALL - VM - DELETE FW ALIAS - PRINT JSON
      debug:
        var: firewall_vm_delete_iptables_alias

  when: proxmox_vm_action == "firewall_vm_delete_iptables_alias"
