---
##
## DELETE THE SURPLUS LIVE SNAT RULES OF ONE SUBNET, down to sdn_snat_want.
##
## The working plan calls this primitive "norm_snat". The name here says what it does
## instead of what it achieves, because "norm" invited the reading that it turns NAT on,
## which it cannot : see below, it only ever deletes.
##
## This is the one action of the role that is NOT an API call. It runs iptables on the
## Proxmox node itself, because the problem it solves lives below the API.
##
## WHY IT EXISTS
## An SDN apply is not idempotent. Reloading the network configuration replays the
## post-up hooks without ever playing the post-down ones, so every apply adds one more
## SNAT rule per subnet that has snat=1. Measured on a clean chain : 1, then 2, then 3
## rules for two consecutive applies with no change at all. With twelve vnets that is
## twelve extra rules per apply. Setting snat=0 makes it worse, because it removes the
## post-down hook from the configuration before that hook ever had a chance to run,
## leaving the live rule orphaned.
##
## This is NOT a return to the old hack. The rule stays declared by the SDN, Proxmox
## still owns it and it still survives a reboot. All this action does is reconcile the
## live state with the declared one, which is what Ansible does everywhere else.
##
## WHAT IT DOES, AND WHAT IT DOES NOT
## It DELETES surplus rules down to sdn_snat_want. It never creates one. So want=1 on a
## subnet that currently has zero rules leaves zero : creating the rule is the apply's
## job, not this one. want=0 cuts the subnet off from the outside.
##
## It works for SNAT and for MASQUERADE alike, since it matches on the source network
## rather than on the target. That is what makes it usable to clean up the rules left
## behind by the legacy hack, one subnet at a time.
##
## THREE THINGS THAT MUST NOT BE CHANGED
##  1. the trailing SPACE in "-s ${S} " is load bearing. Without it, a value of
##     192.168.14 would also match 192.168.140.0/24 and delete rules of another subnet.
##  2. the host address is never hardcoded. The live rules are read back and the leading
##     -A is turned into -D, so whatever Proxmox put there is what gets removed.
##  3. the command substitution feeding iptables is deliberately unquoted : the rule
##     specification has to be split into separate arguments.
##
## sdn_subnet_cidr must be written exactly as iptables renders it, mask included, for
## instance 192.168.199.0/24. The assert below refuses anything else : this task
## deletes firewall rules, so an empty or malformed value must stop it rather than let
## it match something unintended.
##

- block:
    ####
    ####

    - name: NETWORK - DELETE SNAT RULES - CHECK THE SUBNET IS A WELL FORMED CIDR
      ansible.builtin.assert:
        that:
          - sdn_subnet_cidr is defined
          - sdn_subnet_cidr is string
          ## The match TEST, not the regex_search FILTER : a filter returns the matched
          ## text, and a conditional that resolves to a string rather than a boolean is
          ## refused outright by ansible-core. Same anchors, boolean result.
          - sdn_subnet_cidr is match('^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$')
        fail_msg: >-
          sdn_subnet_cidr must be a CIDR with its mask, exactly as iptables renders it,
          for instance 192.168.199.0/24. Got: {{ sdn_subnet_cidr | default('<undefined>') }}
        success_msg: "sdn_subnet_cidr = {{ sdn_subnet_cidr | default('') }}"

    ####
    ####
    ## The loop is bounded on purpose. The plan's snippet loops until the count drops,
    ## which never ends if a deletion silently fails, and this task runs on the
    ## hypervisor. Giving up loudly after 1000 deletions beats hanging a deploy.
    ####

    - name: NETWORK - DELETE SNAT RULES - NORMALISE THE LIVE RULE COUNT
      ansible.builtin.shell: |
        set -u
        S='{{ sdn_subnet_cidr }}'
        want='{{ sdn_snat_want | default(1) }}'

        count() { iptables -t nat -S POSTROUTING | grep -c -- "-s ${S} " || true; }

        before=$(count)
        guard=0
        while [ "$(count)" -gt "$want" ]; do
          guard=$((guard + 1))
          if [ "$guard" -gt 1000 ]; then
            echo "delete_snat_rules: gave up after 1000 deletions, the rule count is not decreasing" >&2
            exit 1
          fi
          # shellcheck disable=SC2046,SC2086
          iptables -t nat $(iptables -t nat -S POSTROUTING | grep -m1 -- "-s ${S} " | sed 's/^-A /-D /')
        done
        after=$(count)

        printf '{"before":%s,"after":%s,"want":%s,"deleted":%s}\n' \
          "$before" "$after" "$want" "$((before - after))"
      args:
        executable: /bin/bash
      register: proxmox_call
      changed_when: (proxmox_call.stdout | from_json).before != (proxmox_call.stdout | from_json).after

    ####
    ####

    - name: NETWORK - DELETE SNAT RULES - proxmox_call
      debug:
        var: proxmox_call

    ####
    ####

    - name: NETWORK - DELETE SNAT RULES - BUILD JSON
      set_fact:
        network_delete_snat_rules:
          action: "network_delete_snat_rules"
          source: "proxmox"
          proxmox_node: "{{ proxmox_node }}"

          subnet_cidr: "{{ sdn_subnet_cidr }}"
          snat_want: "{{ (proxmox_call.stdout | from_json).want }}"
          snat_before: "{{ (proxmox_call.stdout | from_json).before }}"
          snat_after: "{{ (proxmox_call.stdout | from_json).after }}"
          snat_deleted: "{{ (proxmox_call.stdout | from_json).deleted }}"

    ####
    ####
    ## This debug task is NOT cosmetic : the devkit helper extracts its payload with
    ##   select(type=="object" and has($action)) | .[$action]
    ## so a JSON key named EXACTLY like the action must appear in the task results.
    ## Without it the devkit returns an empty stream and exits 0 (silent failure).
    ####

    - name: NETWORK - DELETE SNAT RULES - PRINT JSON
      debug:
        var: network_delete_snat_rules

  ####
  ####

  when: proxmox_vm_action == "network_delete_snat_rules"
