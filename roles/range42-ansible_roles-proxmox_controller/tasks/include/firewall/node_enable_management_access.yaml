---
##
## ANTI-LOCKOUT : GUARANTEE MANAGEMENT ACCESS TO A NODE BEFORE ITS FIREWALL GOES ON.
##
## POST /nodes/{node}/firewall/rules, twice.
##
## Enabling a node firewall without an accepted path to the web interface and to ssh locks
## the operator out of the machine, and recovering from that needs physical or console
## access. This action is the guard to run BEFORE firewall_node_enable, never after.
##
##     8006/tcp   the Proxmox web interface and its API, which is also how this role talks
##                to the cluster : losing it means losing the tool that would fix it
##     22/tcp     ssh
##
## >>> POSITIONS ARE PASSED EXPLICITLY, AND THAT IS THE WHOLE POINT <<<
## The Proxmox firewall evaluates rules in order. An accept sitting below a drop accepts
## nothing. Leaving the position to whatever the API defaults to turns this guard into a
## coin toss between protecting access and blocking it, so both rules carry an explicit
## position at the top of the chain. Do not remove them.
##
## Reading the chain first makes the action idempotent. Posting blindly appends another
## pair on every run.
##
## Scope note : this only covers the node chain. A guest reached through this node has its
## own chain, and the datacenter level has its own options as well.
##

##
## >>> NO INTERFACE SCOPE AND NO SOURCE SCOPE : THAT IS DELIBERATE, NOT AN OVERSIGHT <<<
## Both accepts are posted with neither `iface` nor `source`, so they accept on EVERY
## interface from EVERY origin - including the guest networks, which means a guest can reach
## the api and ssh ports. That is broader than it should be and it is a known trade.
##
## The reason is an ordering of risks : a rule that is too broad can be narrowed later by
## anyone who can read the chain, while a lockout costs physical or console access to every
## node. Narrowing it here would mean guessing the name of the management interface and the
## addresses of the management plane, and a wrong guess is exactly the failure that cannot be
## undone remotely. The priority, while the range is being built, is keeping access.
##
## An administrator who knows their own topology narrows these rules by hand, naming the
## interface and the sources that fit their infrastructure - which this role cannot infer.
##
## Restricting them properly is separate work : it depends on where the deployer sits, on the
## gateways of the guest networks since the deployer reaches guests through them, and on a
## whitelist that belongs in the workspace vault. It gets its own issue rather than a guess
## made here.
##

- block:
    ####
    ####
    ## Read before write : what is already there decides what gets posted.
    ####

    - name: FIREWALL - NODE - ENABLE MANAGEMENT ACCESS - READ THE CURRENT CHAIN
      uri:
        url: "https://{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/firewall/rules"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
      register: proxmox_call_rules

    ####
    ## >>> PRESENCE IS NOT PROTECTION : THE ACCEPT MUST SIT ABOVE THE FIRST DENY <<<
    ## This test used to ask only "is there an ACCEPT on 8006 somewhere in the chain".
    ## The chain is ordered, so an ACCEPT below a DROP accepts nothing - the very thing
    ## the header of this file warns about. A guard that answers "already in place" for a
    ## rule that grants nothing SKIPS ITSELF and leaves the node unprotected while
    ## reporting it protected. So the position is now part of the question.
    ##
    ## The barrier is the FIRST inbound DROP or REJECT. Both are barriers : a REJECT
    ## blocks just as surely, it only differs in what it answers back.
    ##
    ## 99999 is the sentinel for "no deny at all", appended so `first` always has
    ## something to return on an empty chain. A fresh node has no rules, both accepts
    ## then read as absent and both get posted, which is the wanted behaviour.
    ##
    ## Two ACCEPTs on DISJOINT ports commute : 8006-before-22 or 22-before-8006 changes
    ## nothing. What is load bearing is that BOTH sit above the first deny.
    ##
    ## NOT covered here, on purpose : `source` is not part of the test. A rule scoped to
    ## a source that does not include the caller reads as present and is skipped. Widening
    ## management access to its several legitimate origins - the internet, the deployer, the
    ## backend api and the ui - is separate work, and it is not this correction.
    ####

    - name: FIREWALL - NODE - ENABLE MANAGEMENT ACCESS - WHERE THE CHAIN STARTS DENYING
      set_fact:
        _node_fw_first_deny_pos: >-
          {{ (((proxmox_call_rules.json.data | default([], true))
                | selectattr('type', 'defined') | selectattr('type', 'equalto', 'in')
                | selectattr('action', 'defined') | selectattr('action', 'in', ['DROP', 'REJECT'])
                | selectattr('enable', 'defined')
                | rejectattr('enable', 'equalto', 0) | rejectattr('enable', 'equalto', '0')
                | selectattr('pos', 'defined') | map(attribute='pos') | map('int') | list)
              + [99999]) | sort | first }}
        _node_fw_api_first_pos: >-
          {{ (((proxmox_call_rules.json.data | default([], true))
                | selectattr('type', 'defined') | selectattr('type', 'equalto', 'in')
                | selectattr('action', 'defined') | selectattr('action', 'equalto', 'ACCEPT')
                | selectattr('dport', 'defined')
                | selectattr('dport', 'equalto', node_fw_api_port | default('8006') | string)
                | selectattr('enable', 'defined')
                | rejectattr('enable', 'equalto', 0) | rejectattr('enable', 'equalto', '0')
                | selectattr('pos', 'defined') | map(attribute='pos') | map('int') | list)
              + [99999]) | sort | first }}
        _node_fw_ssh_first_pos: >-
          {{ (((proxmox_call_rules.json.data | default([], true))
                | selectattr('type', 'defined') | selectattr('type', 'equalto', 'in')
                | selectattr('action', 'defined') | selectattr('action', 'equalto', 'ACCEPT')
                | selectattr('dport', 'defined')
                | selectattr('dport', 'equalto', node_fw_ssh_port | default('22') | string)
                | selectattr('enable', 'defined')
                | rejectattr('enable', 'equalto', 0) | rejectattr('enable', 'equalto', '0')
                | selectattr('pos', 'defined') | map(attribute='pos') | map('int') | list)
              + [99999]) | sort | first }}

    ####
    ## A separate task on purpose : the three positions above must be resolved before
    ## these two can read them. Keys of one single set_fact are all evaluated against the
    ## state BEFORE the task, so they cannot reference each other.
    ####

    - name: FIREWALL - NODE - ENABLE MANAGEMENT ACCESS - WHAT IS ALREADY IN PLACE, AND WELL PLACED
      set_fact:
        _node_fw_has_api: "{{ (_node_fw_api_first_pos | int) < (_node_fw_first_deny_pos | int) }}"
        _node_fw_has_ssh: "{{ (_node_fw_ssh_first_pos | int) < (_node_fw_first_deny_pos | int) }}"

    - name: FIREWALL - NODE - ENABLE MANAGEMENT ACCESS - THE CHAIN AS IT READS NOW
      debug:
        msg: >-
          first deny at {{ _node_fw_first_deny_pos }} :
          api {{ node_fw_api_port | default('8006') }} at {{ _node_fw_api_first_pos }} ->
          {{ 'protected' if _node_fw_has_api else 'NOT PROTECTED, will be posted' }} ;
          ssh {{ node_fw_ssh_port | default('22') }} at {{ _node_fw_ssh_first_pos }} ->
          {{ 'protected' if _node_fw_has_ssh else 'NOT PROTECTED, will be posted' }}

    ####
    ####
    ## The API port first : it is the way back in if anything else goes wrong.
    ####

    - name: FIREWALL - NODE - ENABLE MANAGEMENT ACCESS - ACCEPT THE API PORT
      uri:
        url: "https://{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/firewall/rules"
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        body_format: json
        body:
          type: "in"
          action: "ACCEPT"
          proto: "tcp"
          dport: "{{ node_fw_api_port | default('8006') }}"
          enable: 1
          pos: "{{ node_fw_api_pos | default(0) }}"
          source: "{{ node_fw_mgmt_source | default(omit) }}"
          comment: "{{ node_fw_api_comment | default('range42 anti-lockout, proxmox api') }}"
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
      register: proxmox_call
      when: not _node_fw_has_api

    ####
    ####
    ## Then ssh, immediately below it.
    ####

    - name: FIREWALL - NODE - ENABLE MANAGEMENT ACCESS - ACCEPT SSH
      uri:
        url: "https://{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/firewall/rules"
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        body_format: json
        body:
          type: "in"
          action: "ACCEPT"
          proto: "tcp"
          dport: "{{ node_fw_ssh_port | default('22') }}"
          enable: 1
          pos: "{{ node_fw_ssh_pos | default(1) }}"
          source: "{{ node_fw_mgmt_source | default(omit) }}"
          comment: "{{ node_fw_ssh_comment | default('range42 anti-lockout, ssh') }}"
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
      register: proxmox_call_ssh
      when: not _node_fw_has_ssh

    ####
    ####

    - name: FIREWALL - NODE - ENABLE MANAGEMENT ACCESS - BUILD JSON
      set_fact:
        firewall_node_enable_management_access:
          action: "firewall_node_enable_management_access"
          source: "proxmox"
          proxmox_node: "{{ proxmox_node }}"

          ## `_requested` is what the caller asked for, `_before` is what the chain actually
          ## held when it was read. Publishing only the first is what the old output did, and
          ## it read as a measurement while being an input : `api_pos: 0` looked like *the
          ## accept sits at 0* when it meant *we asked for 0*. The measured values existed
          ## already, in the debug task above, which the devkit helper does NOT extract - so
          ## they were computed and thrown away. `_before` follows the naming the role already
          ## uses for an observation, as in `snat_before` of the SNAT reconciliation.
          api_port: "{{ node_fw_api_port | default('8006') }}"
          api_pos_requested: "{{ node_fw_api_pos | default(0) }}"
          api_pos_before: "{{ _node_fw_api_first_pos }}"
          api_already_present: "{{ _node_fw_has_api }}"

          ssh_port: "{{ node_fw_ssh_port | default('22') }}"
          ssh_pos_requested: "{{ node_fw_ssh_pos | default(1) }}"
          ssh_pos_before: "{{ _node_fw_ssh_first_pos }}"
          ssh_already_present: "{{ _node_fw_has_ssh }}"

          ## The barrier itself. Without it a reader cannot tell WHY the two booleans above
          ## are what they are : an accept at 3 is protective under a deny at 9 and useless
          ## under a deny at 1. 99999 is the sentinel for a chain with no deny at all.
          first_deny_pos_before: "{{ _node_fw_first_deny_pos }}"

          mgmt_source: "{{ node_fw_mgmt_source | default(omit) }}"

    ####
    ####
    ## This debug task is NOT cosmetic : the devkit helper extracts its payload with
    ##   select(type=="object" and has($action)) | .[$action]
    ## so a JSON key named EXACTLY like the action must appear in the task results.
    ## Without it the devkit returns an empty stream and exits 0 (silent failure).
    ####

    - name: FIREWALL - NODE - ENABLE MANAGEMENT ACCESS - PRINT JSON
      debug:
        var: firewall_node_enable_management_access

  ####
  ####

  when: proxmox_vm_action == "firewall_node_enable_management_access"
