---
##
## TURN THE FIREWALL FLAG OFF, ON ONE NETWORK CARD OF ONE GUEST.
##
## GET then POST /nodes/{node}/qemu/{vmid}/config, on the net<N> option.
##
## >>> THIS SETS firewall=0, IT DOES NOT REMOVE THE KEY <<<
## Measured : `firewall=0` and an ABSENT key produce the same observable effect - nothing is
## filtered either way. But they come from opposite intentions, and nobody can tell an isolation
## that was DECLINED from one that was LOST. Writing the zero explicitly says which one this is.
##
## >>> IT ALSO HANDS MAC SPOOFING BACK, AND THAT IS NOT A SIDE EFFECT TO IGNORE <<<
## The same flag carries PVE's MAC anti-spoof, and the two cannot be separated. Measured from a
## root shell inside a guest : with the flag set, the guest becomes unreachable the moment it
## changes its MAC ; without it, it stays reachable ON THE FAKE ADDRESS. So this action gives the
## guest back the ability to lie about its MAC.
##
## In a cyber range that is sometimes exactly what is wanted - a MITM or ARP-spoofing exercise
## needs it, and a range that forbids it cannot teach it. THIS ACTION IS THE ONLY WAY TO ASK FOR
## IT : the guest-level enable sets this flag automatically, so an administrator who wants a
## spoofable card calls this one directly. What cannot be had is both - one flag, two features,
## so a card is either filtered or free to spoof, never both.
##
## >>> IT EDITS THE STRING IT READ, IT NEVER REBUILDS ONE <<<
## Writing net<N> replaces the WHOLE option, all keys at once. A caller that rebuilt the string
## from parsed fields would silently drop everything it did not know about - the MAC, the VLAN
## tag, the MTU, the queues, the rate, and any key a future PVE version adds. So this action
## reads the raw string, removes only the firewall key, appends the wanted one, and leaves every
## other character untouched.
##
## >>> IT READS BACK TWICE <<<
## Once on the STORED config, to prove the write landed and nothing else moved. Once on the
## CURRENT config, the values the running guest actually has, because a change PVE deferred to
## the next reboot would show in the stored config while the running card still filters.
##
## The MAC is compared explicitly, and not only through the whole-string comparison, because it
## is the one key whose loss is silent on the Proxmox side and fatal inside the guest : the
## netplan cloud-init writes carries a match on macaddress, so a new MAC makes the guest lose
## its network while the api still reports a healthy card. It cost two guests the 2026-08-31.
##
## Required : proxmox_node, vm_id, vm_vmnet_id.
##

- block:
    ####
    ####

    - name: FIREWALL - VM - IFACE DISABLE - READ THE CARD, RAW
      uri:
        url: "https://{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ vm_id }}/config"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
      register: proxmox_call_cfg_before

    - name: FIREWALL - VM - IFACE DISABLE - THE STRING WE START FROM
      set_fact:
        _vm_ifdi_key: "net{{ vm_vmnet_id }}"
        _vm_ifdi_before: "{{ proxmox_call_cfg_before.json.data['net' + (vm_vmnet_id | string)] | default('') }}"

    ## Refused before anything is written. A card that is not there cannot be armed, and a card
    ## whose string we cannot read is one we would rewrite blind.
    - name: FIREWALL - VM - IFACE DISABLE - REFUSE TO TOUCH A CARD THAT IS NOT THERE
      ansible.builtin.assert:
        that:
          - (_vm_ifdi_before | length) > 0
        fail_msg: >-
          vm {{ vm_id }} has no card {{ _vm_ifdi_key }}, or its configuration could not be read.
          NOTHING was changed. Cards it really has :
          {{ proxmox_call_cfg_before.json.data | default({}) | dict2items
             | selectattr('key', 'match', '^net[0-9]+$') | map(attribute='key') | list }}.
        success_msg: >-
          {{ _vm_ifdi_key }} reads : {{ _vm_ifdi_before }}

    ####
    ## THE EDIT. Three substitutions and one append, on the string itself.
    ##
    ## The key can sit anywhere in the option, so all three positions are handled : in the
    ## middle, at the very start, and alone. `firewall=[^,]*` and not `firewall=[01]` on
    ## purpose - a value we do not recognise must be removed too, not left behind to be read
    ## by PVE alongside the one we append.
    ####
    - name: FIREWALL - VM - IFACE DISABLE - STRIP ANY FIREWALL KEY, THEN SET IT TO ZERO
      set_fact:
        _vm_ifdi_stripped: >-
          {{ _vm_ifdi_before
             | regex_replace(',firewall=[^,]*', '')
             | regex_replace('^firewall=[^,]*,', '')
             | regex_replace('^firewall=[^,]*$', '') }}

    - name: FIREWALL - VM - IFACE DISABLE - THE STRING WE INTEND TO WRITE
      set_fact:
        _vm_ifdi_wanted: "{{ _vm_ifdi_stripped }},firewall=0"
        _vm_ifdi_was_off: "{{ 'firewall=0' in _vm_ifdi_before }}"

    - name: FIREWALL - VM - IFACE DISABLE - ALREADY ON, NOTHING TO WRITE
      ansible.builtin.debug:
        msg: >-
          {{ _vm_ifdi_key }} of vm {{ vm_id }} already carries firewall=0 - skipped, the card was
          not rewritten and its MAC is untouched.
      when: _vm_ifdi_was_off | bool

    - name: FIREWALL - VM - IFACE DISABLE - WRITE THE CARD
      uri:
        url: "https://{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ vm_id }}/config"
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
        body_format: json
        body: >-
          {{ { _vm_ifdi_key: _vm_ifdi_wanted } }}
      register: proxmox_call
      when: not (_vm_ifdi_was_off | bool)

    ####
    ## THE READ-BACK, TWICE. See the header : the stored config proves the write landed, the
    ## current config proves the running guest actually has it.
    ####
    - name: FIREWALL - VM - IFACE DISABLE - READ THE STORED CARD BACK
      uri:
        url: "https://{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ vm_id }}/config"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
      register: proxmox_call_cfg_after

    - name: FIREWALL - VM - IFACE DISABLE - READ THE CARD THE RUNNING GUEST HAS
      uri:
        url: "https://{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ vm_id }}/config?current=1"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_api_validate_certs | default(false) }}"
      register: proxmox_call_cfg_current
      failed_when: false

    - name: FIREWALL - VM - IFACE DISABLE - WHAT THE THREE READINGS SAY
      set_fact:
        _vm_ifdi_after: "{{ proxmox_call_cfg_after.json.data['net' + (vm_vmnet_id | string)] | default('') }}"
        _vm_ifdi_current: "{{ (proxmox_call_cfg_current.json.data | default({}))['net' + (vm_vmnet_id | string)] | default('') }}"
        _vm_ifdi_mac_before: "{{ _vm_ifdi_before | regex_search('([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}') | default('', true) }}"

    - name: FIREWALL - VM - IFACE DISABLE - THE VERDICT, ON THE STRINGS THEMSELVES
      set_fact:
        _vm_ifdi_mac_after: "{{ _vm_ifdi_after | regex_search('([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}') | default('', true) }}"
        _vm_ifdi_is_off: "{{ 'firewall=0' in _vm_ifdi_after }}"
        _vm_ifdi_lost_keys: >-
          {{ (_vm_ifdi_before | regex_replace(',?firewall=[^,]*', '') | split(','))
             | reject('equalto', '')
             | difference((_vm_ifdi_after | regex_replace(',?firewall=[^,]*', '') | split(',')) | reject('equalto', '') | list)
             | list }}
        _vm_ifdi_current_agrees: >-
          {{ (_vm_ifdi_current | length) == 0 or ('firewall=0' in _vm_ifdi_current) }}

    ## Four questions, four failure modes, and each names what it saw. Nothing here is inferred
    ## from a return code : the strings are compared, before against after.
    - name: FIREWALL - VM - IFACE DISABLE - REFUSE TO REPORT A SUCCESS THAT IS NOT ONE
      ansible.builtin.assert:
        that:
          - _vm_ifdi_is_off | bool
          - (_vm_ifdi_mac_before | length) == 0 or (_vm_ifdi_mac_after == _vm_ifdi_mac_before)
          - ((_vm_ifdi_lost_keys | default([])) | length) == 0
          - _vm_ifdi_current_agrees | bool
        fail_msg: >-
          the card was rewritten and the result is NOT what was intended.
          before  : {{ _vm_ifdi_before }}
          intended: {{ _vm_ifdi_wanted }}
          stored  : {{ _vm_ifdi_after }}
          running : {{ _vm_ifdi_current | default('not read') }}
          {{ 'The firewall flag is NOT zero on the stored card.'
             if not (_vm_ifdi_is_off | bool) else '' }}
          {{ 'THE MAC CHANGED, from ' ~ _vm_ifdi_mac_before ~ ' to ' ~ _vm_ifdi_mac_after ~
                '. The guest has very likely lost its network : cloud-init writes a netplan that
                 matches on macaddress, and nothing on the Proxmox side shows it. Put the old MAC
                 back on this card and reboot the guest.'
             if ((_vm_ifdi_mac_before | length) > 0 and _vm_ifdi_mac_after != _vm_ifdi_mac_before) else '' }}
          {{ 'SETTINGS WERE LOST by the write : ' ~ (_vm_ifdi_lost_keys | join(', ')) ~
                '. Writing net<N> replaces the whole option, so anything absent from what was
                 sent is gone. Put them back explicitly.'
             if ((_vm_ifdi_lost_keys | default([])) | length) > 0 else '' }}
          {{ 'The STORED card reads zero but the RUNNING guest does not : PVE deferred the change.
              The card is still filtering, and still blocking MAC spoofing, until the guest is
              rebooted. Do not treat it as disarmed.'
             if not (_vm_ifdi_current_agrees | bool) else '' }}
        success_msg: >-
          {{ _vm_ifdi_key }} of vm {{ vm_id }} carries firewall=0
          {{ '(already did, nothing was written)' if (_vm_ifdi_was_off | bool) else '' }},
          MAC {{ _vm_ifdi_mac_after | default('none', true) }} unchanged, no setting lost,
          the running guest agrees, and MAC spoofing is possible again on this card

    ####
    ####

    - name: FIREWALL - VM - IFACE DISABLE - BUILD JSON
      set_fact:
        firewall_vm_iface_disable:
          action: "firewall_vm_iface_disable"
          source: "proxmox"
          proxmox_node: "{{ proxmox_node }}"
          #
          vm_id: "{{ vm_id }}"
          vm_name: "{{ vm_name | default('') }}"
          vm_vmnet_id: "{{ vm_vmnet_id }}"
          vm_network_device: "{{ _vm_ifdi_key }}"
          vm_network_mac: "{{ _vm_ifdi_mac_after | default('', true) }}"
          #
          iface_firewall_before: "{{ '0' if (_vm_ifdi_was_off | bool) else '1' }}"
          iface_firewall_after: "{{ '0' if (_vm_ifdi_is_off | bool) else '1' }}"
          already_present: "{{ _vm_ifdi_was_off | bool }}"
          #
          net_before: "{{ _vm_ifdi_before }}"
          net_after: "{{ _vm_ifdi_after }}"

    - name: FIREWALL - VM - IFACE DISABLE - PRINT JSON
      debug:
        var: firewall_vm_iface_disable

  ####
  ####

  when: proxmox_vm_action == "firewall_vm_iface_disable"
